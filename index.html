<!DOCTYPE html>
<html lang="es" class="antialiased text-ink bg-bg scroll-smooth selection:bg-gold selection:text-bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection Hub V3 — Production Scale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0E0E10', surface: '#18181B', surface2: '#27272A',
          line: '#3F3F46', ink: '#FAFAFA', dim: '#A1A1AA',
          gold: '#EAB308', emerald: '#10B981'
        },
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
          display: ['"Inter Tight"', 'sans-serif'],
        }
      }
    }
  };
</script>

<style>
  :root { --accent: #EAB308; }
  body { overflow-x: hidden; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #0E0E10; }
  ::-webkit-scrollbar-thumb { background: #3F3F46; border-radius: 4px; }
  
  .glass { background: rgba(24, 24, 27, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.08); }
  .card { transition: border-color 0.3s ease, transform 0.3s cubic-bezier(0.23, 1, 0.32, 1); border: 1px solid rgba(255,255,255,0.06); }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 12px 30px -10px color-mix(in srgb, var(--accent) 15%, transparent); }
  
  @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .modal-enter { animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  dialog::backdrop { background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); }
  .hide-scrollbar::-webkit-scrollbar { display: none; }
</style>
</head>
<body class="text-sm">

<header class="fixed top-0 w-full z-40 glass px-6 py-4 flex items-center justify-between">
  <div class="flex items-center gap-2 font-display font-semibold text-lg tracking-tight">
    <div class="w-3 h-3 rounded-sm bg-gradient-to-br from-gold to-orange-500 shadow-[0_0_12px_rgba(234,179,8,0.4)]"></div>
    Collection Hub <span class="text-xs px-2 py-0.5 bg-surface2 rounded text-gold font-mono border border-line">V3 Scale</span>
  </div>
  <div class="relative group">
    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-dim group-focus-within:text-gold transition-colors"></i>
    <input id="searchInput" type="text" placeholder="Buscar 100k+ ítems (⌘K)" class="bg-surface2/50 border border-line rounded-lg pl-9 pr-4 py-2 text-sm outline-none focus:border-gold transition-all w-48 focus:w-72">
  </div>
</header>

<main class="pt-28 px-6 max-w-7xl mx-auto min-h-screen flex flex-col">
  <section class="mb-8">
    <h1 class="font-display font-bold text-4xl tracking-tight mb-2">Archivo Centralizado.</h1>
    <p class="text-dim text-base mb-6" id="statsLabel">Sincronizando motor de alta escala...</p>
    
    <div class="flex gap-4 border-b border-line pb-px" id="tabs">
      <button data-tab="all" class="px-1.5 py-3 border-b-2 border-gold text-ink font-medium transition-colors cursor-pointer">Todo el archivo</button>
      <button data-tab="wishlist" class="px-1.5 py-3 border-b-2 border-transparent text-dim hover:text-ink transition-colors cursor-pointer">Radar (Wishlist)</button>
    </div>
  </section>

  <section class="flex flex-wrap items-center gap-3 mb-6">
    <select id="colFilter" class="bg-surface border border-line rounded-lg px-3 py-2 outline-none focus:border-gold cursor-pointer text-sm">
      <option value="ALL">Todas las colecciones</option>
    </select>
  </section>

  <div id="virtualContainer" class="relative flex-1 w-full overflow-y-auto" style="height: 70vh;">
    <div id="virtualSpacer" class="absolute top-0 left-0 w-full"></div>
    <div id="gridItemsLayer" class="absolute top-0 left-0 w-full grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
  </div>
</main>

<dialog id="detailModal" class="ml-auto mr-0 h-full max-h-screen w-full max-w-xl bg-surface border-l border-line p-0 shadow-2xl m-0 backdrop:bg-black/60">
  <div class="h-full flex flex-col modal-enter relative">
    <button id="closeModalBtn" class="absolute top-6 right-6 z-20 p-2 bg-black/50 backdrop-blur-md rounded-full hover:bg-black/80 transition-colors text-white border border-white/10 cursor-pointer">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>
    
    <div class="w-full h-80 bg-surface2 relative overflow-hidden shrink-0 flex items-center justify-center" id="modalGallery"></div>

    <div class="p-8 overflow-y-auto hide-scrollbar flex-1">
      <div id="modalTags" class="flex flex-wrap gap-2 mb-3"></div>
      <h2 id="modalTitle" class="font-display font-bold text-2xl mb-1 leading-tight"></h2>
      <p id="modalBrand" class="text-dim text-sm mb-6"></p>

      <div class="grid grid-cols-2 gap-4 mb-6" id="modalUniversalAttr"></div>

      <div class="h-px w-full bg-line mb-6"></div>
      
      <h3 class="text-xs font-semibold text-dim uppercase tracking-wider mb-4">Especificaciones Técnicas</h3>
      <div class="flex flex-col gap-3 mb-8" id="modalDynamicAttr"></div>

      <h3 class="text-xs font-semibold text-dim uppercase tracking-wider mb-4">Historial de la Pieza</h3>
      <div class="border-l border-line pl-4 ml-2 flex flex-col gap-6" id="modalTimeline"></div>
    </div>
  </div>
</dialog>

<script>
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbx6b49psU1S4PwQ6mRT2tu4FOdK-Px7-PH7H9zWNNYde0-88I1Csq4nReb8_0Dm3z0gow/exec' 
};

let appState = {
  rawItems: [],
  filteredItems: [],
  colecciones: [],
  activeTab: 'all',
  activeCollection: 'ALL',
  searchQuery: '',
  worker: null
};

function initWorker() {
  const blob = new Blob([document.getElementById('workerCode').textContent], { type: 'application/javascript' });
  appState.worker = new Worker(URL.createObjectURL(blob));
  
  appState.worker.onmessage = (e) => {
    const { type, data } = e.data;
    if (type === 'READY') {
      applyFilters();
    } else if (type === 'RESULTS') {
      appState.filteredItems = data;
      renderVirtualGrid();
    }
  };
}

async function initApp() {
  initWorker();
  try {
    const res = await fetch(CONFIG.API_URL);
    const json = await res.json();
    if (!json.success) throw new Error("Fallo en la respuesta del backend");
    
    appState.colecciones = json.data.colecciones;
    appState.rawItems = json.data.items;
    
    document.getElementById('statsLabel').innerHTML = `Gestionando <b class="text-ink">${appState.rawItems.length}</b> artículos con motor V3 optimizado.`;
    
    const colSelect = document.getElementById('colFilter');
    colSelect.innerHTML = `<option value="ALL">Todas las colecciones</option>` + 
      appState.colecciones.map(c => `<option value="${c.ID_Coleccion}">${c.Nombre}</option>`).join('');

    appState.worker.postMessage({ type: 'INIT', payload: { items: appState.rawItems } });
    setupEvents();
  } catch (err) {
    document.getElementById('statsLabel').textContent = "Error conectando con la base de datos materializada.";
  }
}

function applyFilters() {
  let items = appState.rawItems;
  if (appState.activeTab === 'wishlist') items = items.filter(i => i.estado !== 'Comprado');
  if (appState.activeCollection !== 'ALL') items = items.filter(i => i.id_coleccion === appState.activeCollection);
  
  appState.filteredItems = items;
  renderVirtualGrid();
}

const ROW_HEIGHT = 380;
const COLS_COUNT = 4;

function renderVirtualGrid() {
  const container = document.getElementById('virtualContainer');
  const spacer = document.getElementById('virtualSpacer');
  const layer = document.getElementById('gridItemsLayer');
  
  const totalRows = Math.ceil(appState.filteredItems.length / COLS_COUNT);
  spacer.style.height = `${totalRows * ROW_HEIGHT}px`;

  const scrollTop = container.scrollTop;
  const viewportHeight = container.clientHeight;
  
  const startRow = Math.max(0, Math.floor(scrollTop / ROW_HEIGHT) - 1);
  const endRow = Math.min(totalRows, startRow + Math.ceil(viewportHeight / ROW_HEIGHT) + 2);
  
  layer.style.transform = `translateY(${startRow * ROW_HEIGHT}px)`;
  layer.innerHTML = '';

  const fragment = document.createDocumentFragment();
  for (let r = startRow; r < endRow; r++) {
    for (let c = 0; c < COLS_COUNT; c++) {
      const idx = r * COLS_COUNT + c;
      if (idx >= appState.filteredItems.length) break;
      
      const item = appState.filteredItems[idx];
      const col = appState.colecciones.find(x => x.ID_Coleccion === item.id_coleccion) || {};
      const card = createCardElement(item, col);
      fragment.appendChild(card);
    }
  }
  layer.appendChild(fragment);
  lucide.createIcons();
}

function createCardElement(item, col) {
  const color = col.Color || '#EAB308';
  const isOwned = item.estado === 'Comprado';
  const mainImg = item.imagenes[0] || '';

  const article = document.createElement('article');
  article.className = 'card bg-surface rounded-2xl overflow-hidden cursor-pointer flex flex-col h-[350px]';
  article.style.setProperty('--accent', color);
  article.onclick = () => openModal(item);

  article.innerHTML = `
    <div class="relative aspect-[4/3] bg-surface2 overflow-hidden flex items-center justify-center">
      ${item.destacado ? `<div class="absolute top-3 left-3 z-10 w-2 h-2 rounded-full bg-[var(--accent)] shadow-[0_0_8px_var(--accent)]"></div>` : ''}
      <div class="absolute top-3 right-3 z-10 px-2 py-0.5 text-[10px] font-medium uppercase tracking-wider rounded-full backdrop-blur-md border ${isOwned ? 'bg-emerald-900/30 text-emerald-400 border-emerald-800/50' : 'bg-surface/50 text-dim border-line'}">
        ${item.estado}
      </div>
      ${mainImg ? `<img src="${mainImg}" loading="lazy" class="w-full h-full object-cover">` : `<i data-lucide="${col.Icono || 'box'}" class="w-10 h-10 text-line opacity-50"></i>`}
    </div>
    <div class="p-4 flex-1 flex flex-col justify-between">
      <div>
        <div class="text-[10px] font-semibold uppercase tracking-wider mb-1" style="color: var(--accent)">${col.Nombre || 'General'}</div>
        <h3 class="font-display font-semibold text-sm leading-snug mb-1 line-clamp-1">${item.nombre}</h3>
        <p class="text-dim text-xs line-clamp-1">${item.marca}</p>
      </div>
      <div class="text-sm font-medium">
        ${item.precio ? new Intl.NumberFormat('es-UY', {style:'currency', currency: item.moneda, maximumFractionDigits:0}).format(item.precio) : '—'}
      </div>
    </div>
  `;
  return article;
}

function openModal(item) {
  const dialog = document.getElementById('detailModal');
  const col = appState.colecciones.find(c => c.ID_Coleccion === item.id_coleccion) || {};
  
  const gallery = document.getElementById('modalGallery');
  if (item.imagenes.length > 0) {
    gallery.innerHTML = `<img src="${item.imagenes[0]}" class="w-full h-full object-cover" id="activeModalImg">`;
  } else {
    gallery.innerHTML = `<i data-lucide="${col.Icono || 'box'}" class="w-20 h-20 text-line opacity-30"></i>`;
  }

  document.getElementById('modalTitle').textContent = item.nombre;
  document.getElementById('modalBrand').textContent = item.marca;

  const tagsContainer = document.getElementById('modalTags');
  tagsContainer.innerHTML = `<span class="px-2 py-0.5 text-xs rounded border border-line" style="color: ${col.Color || '#FFF'}">${col.Nombre}</span>`;
  item.etiquetas.forEach(t => {
    tagsContainer.innerHTML += `<span class="px-2 py-0.5 text-xs rounded bg-surface2 border border-line" style="color: ${t.color}">${t.nombre}</span>`;
  });

  document.getElementById('modalUniversalAttr').innerHTML = `
    <div class="bg-surface2 p-3 rounded-xl border border-line">
      <div class="text-[10px] text-dim uppercase tracking-wider mb-1">Estado</div>
      <div class="font-medium ${item.estado==='Comprado' ? 'text-emerald-400' : 'text-ink'}">${item.estado}</div>
    </div>
    <div class="bg-surface2 p-3 rounded-xl border border-line">
      <div class="text-[10px] text-dim uppercase tracking-wider mb-1">Valoración</div>
      <div class="font-medium">${item.precio ? new Intl.NumberFormat('es-UY', {style:'currency', currency: item.moneda}).format(item.precio) : '—'}</div>
    </div>
  `;

  const dynContainer = document.getElementById('modalDynamicAttr');
  dynContainer.innerHTML = item.atributos.length ? item.atributos.map(a => `
    <div class="flex gap-3 items-center bg-surface2/50 p-2.5 rounded-lg border border-line">
      <i data-lucide="${a.icono || 'info'}" class="w-4 h-4 text-dim shrink-0"></i>
      <div class="flex-1 flex justify-between text-xs">
        <span class="text-dim">${a.nombre}</span>
        <span class="font-medium text-ink">${a.valor}</span>
      </div>
    </div>
  `).join('') : `<p class="text-dim text-xs italic">Sin atributos registrados.</p>`;

  const timeline = document.getElementById('modalTimeline');
  timeline.innerHTML = item.historial.length ? item.historial.map(h => `
    <div class="relative pl-3">
      <div class="absolute -left-[5px] top-1.5 w-2.5 h-2.5 rounded-full bg-gold"></div>
      <div class="text-[10px] text-gold font-mono mb-0.5">${h.fecha}</div>
      <div class="text-xs font-semibold text-ink">${h.evento}</div>
      <div class="text-xs text-dim">${h.descripcion}</div>
    </div>
  `).join('') : `<p class="text-dim text-xs italic">Sin eventos en el historial.</p>`;

  lucide.createIcons();
  dialog.showModal();
}

function setupEvents() {
  document.getElementById('virtualContainer').addEventListener('scroll', () => {
    requestAnimationFrame(renderVirtualGrid);
  });

  document.querySelectorAll('#tabs button').forEach(btn => {
    btn.onclick = (e) => {
      document.querySelectorAll('#tabs button').forEach(b => {
        b.className = 'px-1.5 py-3 border-b-2 border-transparent text-dim hover:text-ink transition-colors cursor-pointer';
      });
      e.target.className = 'px-1.5 py-3 border-b-2 border-gold text-ink font-medium transition-colors cursor-pointer';
      appState.activeTab = e.target.dataset.tab;
      applyFilters();
    };
  });

  document.getElementById('colFilter').onchange = (e) => {
    appState.activeCollection = e.target.value;
    applyFilters();
  };

  let searchTimeout;
  document.getElementById('searchInput').oninput = (e) => {
    clearTimeout(searchTimeout);
    const query = e.target.value;
    searchTimeout = setTimeout(() => {
      if (!query) {
        applyFilters();
      } else {
        appState.worker.postMessage({ type: 'SEARCH', payload: { query } });
      }
    }, 250);
  };

  const dialog = document.getElementById('detailModal');
  document.getElementById('closeModalBtn').onclick = () => dialog.close();
  dialog.onclick = (e) => { if(e.target === dialog) dialog.close(); };
}

document.addEventListener('DOMContentLoaded', initApp);
</script>

<script id="workerCode" type="text/plain">
importScripts('https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js');
let fuse = null;
self.onmessage = function(e) {
  const { type, payload } = e.data;
  if (type === 'INIT') {
    fuse = new Fuse(payload.items, { keys: ['nombre', 'marca', 'etiquetas.nombre', 'atributos.valor', 'estado'], threshold: 0.3 });
    self.postMessage({ type: 'READY' });
  } else if (type === 'SEARCH' && fuse) {
    self.postMessage({ type: 'RESULTS', data: fuse.search(payload.query).map(r => r.item) });
  }
};
</script>
</body>
</html>
